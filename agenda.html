<script>
window.OneSignalDeferred = window.OneSignalDeferred || [];
OneSignalDeferred.push(async function (OneSignal) {
  if (!/[?&](modo|view|somente)=leitura/i.test(location.search)) return;
  var local = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
  var opcoes = {
    appId: local ? 'TROCAR_APP_ID_TESTE' : '7cd5d6c9-c615-460e-9a2a-a1bca5a1ef4c',
    serviceWorkerOverrideForTypical: true,
    path: '/agenda-festas',
    serviceWorkerPath: 'push/onesignal/OneSignalSDKWorker.js',
    serviceWorkerParam: { scope: '/agenda-festas/push/onesignal/' },
    welcomeNotification: { title: 'Bem-vindo(a)!', message: 'Obrigado por assinar!' }
  };
  if (local) opcoes.allowLocalhostAsSecureOrigin = true;
  await OneSignal.init(opcoes);
  var appInstalado = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  if (appInstalado) {
    bn_atualizar(OneSignal);
  } else {
    var aviso = function () { bn_atualizar(OneSignal); };
    try {
      var timer = setTimeout(aviso, 2500);
      Promise.resolve(OneSignal.Notifications.requestPermission())
        .then(function () { clearTimeout(timer); aviso(); })
        .catch(function () { clearTimeout(timer); aviso(); });
    } catch (e) { aviso(); }
  }
});

function bn_atualizar(OneSignal) {
  var b = document.getElementById('banner-notif');
  if (!b || !OneSignal || !OneSignal.Notifications) return;
  try { if (localStorage.getItem('bn-notif-fechado') === '1') { b.classList.add('oculto'); return; } } catch (e) {}
  OneSignal.Notifications.getPermission().then(function (p) {
    if (p === 'granted') { b.classList.add('oculto'); return; }
    var tx = b.querySelector('.bn-tx');
    var bt = b.querySelector('#btn-bn-ativar');
    if (p === 'denied') {
      tx.textContent = 'Notificações bloqueadas neste navegador. Abra as configurações do site (cadeado na barra) e permita "Notificações".';
      bt.style.display = 'none';
    } else {
      tx.textContent = 'Ative as notificações para receber avisos das novas montagens.';
      bt.style.display = '';
    }
    b.classList.remove('oculto');
  });
}

async function bn_ativar() {
  var OneSignal = window.OneSignal;
  if (!OneSignal) return;
  await OneSignal.Notifications.requestPermission();
  bn_atualizar(OneSignal);
}

function bn_fechar() {
  try { localStorage.setItem('bn-notif-fechado', '1'); } catch (e) {}
  var b = document.getElementById('banner-notif');
  if (b) b.classList.add('oculto');
}
</script>

<script>
var DADOS = [];
var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MESES_AB = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
var STATUS = ['Agendado','Montado'];
var filtroStatus = 'Agendado';
var EDITANDO_ID = null;
var DETALHE_ID = null;
var DETALHE_GRUPO = [];
var DETALHE_INDEX = 0;
var IMAGENS_EDITANDO = [];
var CHAVE_DADOS = 'agenda_de_festas';
var CHAVE_TEMA = 'agenda_tema';
var MODO = 'lista';
var MODO_LEITURA = /[?&](modo|view|somente)=leitura/i.test(location.search);
var MODO_SERVIDOR = false;
var CAL = { a: new Date().getFullYear(), m: new Date().getMonth() };

var LOGO_SVG =
  '<svg viewBox="0 0 64 64" fill="none">' +
    '<rect width="64" height="64" rx="15" fill="#0fa9a2"/>' +
    '<path d="M16 44 L32 24 L48 44 Z" fill="#26354a"/>' +
    '<path d="M16 35.5 C23 27.5 41 27.5 48 35.5 L48 44 L16 44 Z" fill="#26354a"/>' +
    '<path d="M25 44 L28.3 31.6 M32 44 L32 29.6 M39 44 L35.7 31.6" stroke="#0fa9a2" stroke-width="2.6" stroke-linecap="round"/>' +
    '<circle cx="48" cy="14" r="3.6" fill="#fff"/>' +
    '<circle cx="20" cy="14" r="1.9" fill="#26354a"/>' +
    '<path d="M46 18 l1.7 3.5 3.9.6-2.8 2.7.7 3.9-3.5-1.9-3.5 1.9.7-3.9-2.8-2.7 3.9-.6z" fill="#26354a"/>' +
  '</svg>';

var LOGO_HEADER = LOGO_SVG;
var LOGO_ESCURO = LOGO_SVG;
var LOGO_CLARO = LOGO_SVG;

function resolverLogo(lista, i, cb) {
  if (i >= lista.length) { cb(LOGO_SVG); return; }
  var img = new Image();
  img.onload = function () { cb('<img class="logo-img" src="' + lista[i] + '" alt="logo">'); };
  img.onerror = function () { resolverLogo(lista, i + 1, cb); };
  img.src = lista[i];
}

function prepararLogos(cb) {
  var candClaro = ['logo/logo-claro.svg', 'logo/logo-claro.png'];
  var candEscuro = ['logo/logo-escuro.svg', 'logo/logo-escuro.png'];
  resolverLogo(candClaro, 0, function (src) {
    LOGO_CLARO = src;
    LOGO_HEADER = src;
    resolverLogo(candEscuro, 0, function (src2) {
      LOGO_ESCURO = src2;
      cb();
    });
  });
}

function logoVazio() {
  return temaAtual() === 'escuro' ? LOGO_CLARO : LOGO_ESCURO;
}

var ICONE_LUA =
  '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
var ICONE_SOL =
  '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';

var ICONES = {
  estrela: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3 6.1 6.6.9-4.8 4.6 1.2 6.6L12 17l-6 3.2 1.2-6.6L2.4 9l6.6-.9z"/></svg>',
  pin: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  nota: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  caixa: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>',
  impressora: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>',
  lapis: '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>'
};

function $(id) { return document.getElementById(id); }

// ---------- persistencia ----------
function ler() {
  try { return JSON.parse(localStorage.getItem(CHAVE_DADOS)) || []; }
  catch (e) { return []; }
}
function gravar(dados) {
  try { localStorage.setItem(CHAVE_DADOS, JSON.stringify(dados)); } catch (e) {}
  if (MODO_SERVIDOR) {
    fetch('/dados', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    }).catch(function () {});
  }
}

function notificarMudanca(ehNovo, obj) {
  if (!MODO_SERVIDOR) return;
  fetch('/notificar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      tipo: ehNovo ? 'novo' : 'editado',
      cliente: obj.cliente || '',
      evento: obj.evento || '',
      dataMontagem: obj.dataMontagem || ''
    })
  }).catch(function () {});
}

// ---------- utilidades ----------
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function fmtData(iso) {
  if (!iso) return '';
  var p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
}
function hojeISO() {
  var d = new Date();
  return d.toISOString().split('T')[0];
}
function amanhaISO() {
  var d = new Date();
  d.setDate(d.getDate() + 1);
  return d.toISOString().split('T')[0];
}
function defData(iso) {
  if (!iso) return { num: '--', mes: '', sem: true };
  var p = iso.split('-');
  if (p.length !== 3) return { num: '--', mes: '', sem: true };
  return { num: p[2], mes: (MESES_AB[parseInt(p[1], 10) - 1] || ''), sem: false };
}
function abrevia(s) {
  return s.length > 13 ? s.slice(0, 12) + '\u2026' : s;
}
function ordenar(lista) {
  return lista.sort(function (a, b) {
    var da = a.dataMontagem || '';
    var db = b.dataMontagem || '';
    if (da === db) {
      var ea = a.dataEvento || '';
      var eb = b.dataEvento || '';
      return ea < eb ? -1 : ea > eb ? 1 : 0;
    }
    return da < db ? -1 : 1;
  });
}

// ---------- tema ----------
function temaAtual() {
  return document.documentElement.getAttribute('data-tema') || 'claro';
}
function alternarTema() {
  var t = temaAtual() === 'escuro' ? 'claro' : 'escuro';
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem(CHAVE_TEMA, t); } catch (e) {}
  atualizarIconeTema();
}
function atualizarIconeTema() {
  var b = $('btn-tema');
  if (!b) return;
  b.title = temaAtual() === 'escuro' ? 'Tema claro' : 'Tema escuro';
  b.innerHTML = temaAtual() === 'escuro' ? ICONE_SOL : ICONE_LUA;
}

// ---------- modo de visualizacao ----------
function mudarModo(modo) {
  MODO = modo;
  document.body.setAttribute('data-modo', modo);
  var bts = document.querySelectorAll('.seg-btn');
  for (var i = 0; i < bts.length; i++) {
    bts[i].classList.toggle('ativo', bts[i].getAttribute('data-modo') === modo);
  }
  renderizar();
}

// ---------- tela ----------
function carregar() {
  if (!MODO_SERVIDOR) DADOS = ordenar(ler());
  marcarMontadosAutomaticamente();
  limparImagensConcluidas();
  limparAntigos();
  montarMesesDropdown();
  montarChips();
  renderizar();
}

function marcarMontadosAutomaticamente() {
  var hoje = hojeISO();
  var mudou = 0;
  DADOS.forEach(function (it) {
    if (it.status !== 'Agendado') return;
    var ref = it.dataMontagem || it.dataEvento || '';
    if (ref && ref < hoje) {
      it.status = 'Montado';
      mudou++;
    }
  });
  if (mudou) {
    gravar(DADOS);
    toast(mudou + ' agendamento(s) marcado(s) como Montado automaticamente');
  }
}

function limparImagensConcluidas() {
  var mudou = false;
  DADOS.forEach(function (it) {
    if ((it.status === 'Montado' || it.status === 'Cancelado') && it.imagens && it.imagens.length) {
      if (MODO_SERVIDOR) {
        it.imagens.forEach(function (s) { if (ehCaminhoImagem(s)) apagarImagemServidor(s); });
      }
      it.imagens = [];
      mudou = true;
    }
  });
  if (mudou) gravar(DADOS);
}

var DIAS_EXCLUIR_ANTIGOS = 30;

function limparAntigos() {
  var limite = new Date();
  limite.setDate(limite.getDate() - DIAS_EXCLUIR_ANTIGOS);
  var removidos = 0;
  DADOS = DADOS.filter(function (it) {
    if (it.status !== 'Montado' && it.status !== 'Cancelado') return true;
    var ref = it.dataEvento || it.dataMontagem || '';
    if (!ref) return true;
    var p = ref.split('-');
    var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
    if (isNaN(d.getTime())) return true;
    if (d < limite) { removidos++; return false; }
    return true;
  });
  if (removidos) {
    gravar(DADOS);
    toast(removidos + ' agendamento(s) antigo(s) removido(s)');
  }
}

function rodapeDado(msg) {
  var r = $('rodape-dado');
  if (r) r.innerHTML = msg;
}

function carregarLeitura() {
  var r = $('btn-atualizar');
  if (r && r.textContent !== 'Atualizar') return;
  if (r) r.textContent = 'Buscando...';
  fetch('dados.json', { cache: 'no-store' })
    .then(function (resp) { if (!resp.ok) throw new Error('erro'); return resp.json(); })
    .then(function (j) {
      if (!Array.isArray(j)) throw new Error('erro');
      DADOS = ordenar(j);
      rodapeDado('Atualizado &agrave;s ' + new Date().toLocaleTimeString('pt-BR'));
      montarMesesDropdown();
      montarChips();
      renderizar();
    })
    .catch(function () {
      rodapeDado('N&atilde;o foi poss&iacute;vel carregar os dados &mdash; sem conex&atilde;o?');
      if (DADOS.length === 0) renderizar();
    })
    .then(function () {
      if (r) r.textContent = 'Atualizar';
    });
}

function carregarInicial() {
  rodapeDado('Carregando dados...');
  fetch('/dados', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('offline'); return r.json(); })
    .then(function (j) {
      if (!Array.isArray(j)) throw new Error('offline');
      MODO_SERVIDOR = true;
      var locais = ler();
      if (j.length > 0) {
        DADOS = ordenar(j);
        try { localStorage.setItem(CHAVE_DADOS, JSON.stringify(DADOS)); } catch (e) {}
      } else if (locais.length > 0) {
        DADOS = ordenar(locais);
        fetch('/dados', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(DADOS)
        }).catch(function () {});
      } else {
        DADOS = [];
      }
      rodapeDado('Arquivo <b>dados.json</b> desta pasta &mdash; app port&aacute;til');
      carregar();
      migrarImagensLegadas();
    })
    .catch(function () {
      MODO_SERVIDOR = false;
      rodapeDado('Dados salvos neste navegador. Para compartilhar, use <b>Exportar</b>/<b>Importar</b>.');
      carregar();
    });
}

function migrarImagensLegadas() {
  if (!MODO_SERVIDOR) return;
  var mudou = false;
  DADOS.forEach(function (it) {
    if (!Array.isArray(it.imagens)) return;
    it.imagens.forEach(function (src) {
      if (ehDataURL(src)) mudou = true;
    });
  });
  if (!mudou) return;

  var pend = [];
  DADOS.forEach(function (it) {
    if (!Array.isArray(it.imagens)) return;
    it.imagens.forEach(function (src, i) {
      if (ehDataURL(src)) pend.push({ it: it, i: i, src: src });
    });
  });

  var p = Promise.resolve();
  var total = pend.length;
  rodapeDado('Movendo ' + total + ' foto(s) para a pasta <b>imagens/</b>...');
  var feito = 0;
  pend.forEach(function (t) {
    p = p.then(function () {
      return subirImagem(t.src).then(function (path) {
        if (path) t.it.imagens[t.i] = path;
        feito++;
        if (feito % 5 === 0 || feito === total) {
          rodapeDado('Movendo fotos... ' + feito + '/' + total);
        }
      });
    });
  });
  p.then(function () {
    gravar(DADOS);
    rodapeDado('Fotos movidas para <b>imagens/</b> &mdash; dados.json agora &eacute; leve');
    toast('Fotos antigas movidas para a pasta imagens/');
    try { localStorage.setItem(CHAVE_DADOS, JSON.stringify(DADOS)); } catch (e) {}
  });
}

function montarMesesDropdown() {
  var sel = $('filtro-mes');
  var atual = sel.value;
  var meses = {};
  DADOS.forEach(function (it) {
    var m = (it.dataMontagem || it.dataEvento || '').slice(0, 7);
    if (m) meses[m] = true;
  });
  var chaves = Object.keys(meses).sort();
  sel.innerHTML = '<option value="">Todos os meses</option>';
  chaves.forEach(function (m) {
    var p = m.split('-');
    var a = p[0], mm = p[1];
    var opt = document.createElement('option');
    opt.value = m;
    opt.textContent = MESES[parseInt(mm, 10) - 1] + ' ' + a;
    sel.appendChild(opt);
  });
  sel.value = atual;
}

function montarChips() {
  var area = $('chips-status');
  area.innerHTML = '';
  var todos = document.createElement('span');
  todos.className = 'chip' + (filtroStatus === '' ? ' ativo' : '');
  todos.textContent = 'Todos';
  todos.onclick = function () { filtroStatus = ''; montarChips(); renderizar(); };
  area.appendChild(todos);
  STATUS.forEach(function (s) {
    var c = document.createElement('span');
    c.className = 'chip' + (filtroStatus === s ? ' ativo' : '');
    c.textContent = s;
    c.onclick = function () { filtroStatus = s; montarChips(); renderizar(); };
    area.appendChild(c);
  });
}

function filtrar() {
  var termo = ($('busca').value || '').toLowerCase().trim();
  var mes = $('filtro-mes').value;
  return DADOS.filter(function (it) {
    if (mes && (it.dataMontagem || it.dataEvento || '').slice(0, 7) !== mes) return false;
    if (filtroStatus && it.status !== filtroStatus) return false;
    if (termo) {
      var alvo = [it.cliente, it.local, it.evento, it.materiais, it.obs].join(' ').toLowerCase();
      if (alvo.indexOf(termo) === -1) return false;
    }
    return true;
  });
}

function renderizar() {
  if (MODO === 'cal') renderizarCalendario();
  else renderizarLista();
}

function renderizarLista() {
  var lista = filtrar();
  var main = $('lista');
  main.innerHTML = '';
  var hoje = hojeISO(), amanha = amanhaISO();

  if (lista.length === 0) {
    main.innerHTML = '<div class="vazio"><div class="logo">' + logoVazio() + '</div><p>Nenhum agendamento encontrado.<br>Toque em <b>+</b> para criar o primeiro.</p></div>';
    return;
  }

  var contagem = {};
  lista.forEach(function (it) {
    var c = (it.dataMontagem || it.dataEvento || '').slice(0, 7);
    contagem[c] = (contagem[c] || 0) + 1;
  });

  var grupo = null;
  lista.forEach(function (it) {
    var chaveMes = (it.dataMontagem || it.dataEvento || '').slice(0, 7);
    if (chaveMes !== grupo) {
      grupo = chaveMes;
      var p = chaveMes.split('-');
      var a = p[0], mm = p[1];
      var rotulo = chaveMes ? (MESES[parseInt(mm, 10) - 1] + ' ' + a) : 'Sem data';
      var divMes = document.createElement('div');
      divMes.className = 'mes';
      divMes.innerHTML = escapar(rotulo) + '<span class="qtd">' + (contagem[chaveMes] || '') + ' agendamento' + (contagem[chaveMes] === 1 ? '' : 's') + '</span>';
      main.appendChild(divMes);
    }
    main.appendChild(cartaoHTML(it, hoje, amanha));
  });
}

function renderizarCalendario() {
  var lista = filtrar();
  var main = $('lista');
  var hoje = hojeISO();

  var porData = {};
  lista.forEach(function (it) {
    var d = it.dataMontagem || '';
    if (!d) return;
    (porData[d] = porData[d] || []).push(it);
  });

  var primeiro = new Date(CAL.a, CAL.m, 1);
  var offset = primeiro.getDay();
  var diasNoMes = new Date(CAL.a, CAL.m + 1, 0).getDate();
  var hISO = hoje.split('-');
  var hojeAno = parseInt(hISO[0], 10), hojeMes = parseInt(hISO[1], 10) - 1, hojeDia = parseInt(hISO[2], 10);

  var html = '';
  html += '<div class="cal-card">';
  html += '<div class="cal-cab">' +
    '<button class="cal-setas" onclick="mxMes(-1)">&#10094;</button>' +
    '<div class="cal-titulo">' + MESES[CAL.m] + ' ' + CAL.a + '</div>' +
    '<button class="cal-setas" onclick="mxMes(1)">&#10095;</button>' +
  '</div>';

  var semana = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  html += '<div class="cal-semana">';
  for (var w = 0; w < semana.length; w++) html += '<span>' + semana[w] + '</span>';
  html += '</div>';

  html += '<div class="cal-grid">';
  var total = Math.ceil((offset + diasNoMes) / 7) * 7;
  for (var i = 0; i < total; i++) {
    var num = i - offset + 1;
    if (num < 1 || num > diasNoMes) {
      html += '<div class="cal-dia fora"></div>';
      continue;
    }
    var iso = CAL.a + '-' + pad2(CAL.m + 1) + '-' + pad2(num);
    var ehHoje = (CAL.a === hojeAno && CAL.m === hojeMes && num === hojeDia);
    var itens = porData[iso] || [];
    var idsJson = JSON.stringify(itens.map(function (x) { return x.id; }));
    var acao = itens.length
      ? 'abrirDetalhesDia(' + idsJson + ',0)'
      : 'abrirFormulario(null,\'' + iso + '\')';
    html += '<div class="cal-dia' + (ehHoje ? ' hoje' : '') + '" onclick="' + acao + '">';
    html += '<div class="num">' + num + '</div>';
    var visiveis = itens.slice(0, 3);
    for (var k = 0; k < visiveis.length; k++) {
      var it = visiveis[k];
      html += '<div class="cal-bloco status-' + (it.status || '').toLowerCase() + '" onclick="event.stopPropagation();abrirDetalhesDia(' + idsJson + ',' + k + ')">' + escapar(abrevia(it.cliente || 'Sem nome')) + '</div>';
    }
    if (itens.length > 3) html += '<div class="cal-mais">+' + (itens.length - 3) + ' mais</div>';
    html += '</div>';
  }
  html += '</div>';
  html += '</div>';

  main.innerHTML = html;
}

function mxMes(dir) {
  CAL.m += dir;
  if (CAL.m < 0) { CAL.m = 11; CAL.a--; }
  if (CAL.m > 11) { CAL.m = 0; CAL.a++; }
  renderizar();
}

function cartaoHTML(it, hoje, amanha) {
  var el = document.createElement('div');
  el.className = 'cartao status-' + (it.status || '').toLowerCase();
  var badge = '';
  if ((it.dataMontagem || '') === hoje) badge = '<span class="badge-hoje">Hoje</span>';
  else if ((it.dataMontagem || '') === amanha) badge = '<span class="badge-amanha">Amanhã</span>';

  var d = defData(it.dataMontagem || it.dataEvento);
  var bloco = '<div class="bloco-data' + (d.sem ? ' sem' : '') + '">' +
      '<div class="dia">' + d.num + '</div>' +
      '<div class="mes-ab">' + d.mes + '</div>' +
    '</div>';

  var materiais = (it.materiais || '').trim();
  var blocoMat = materiais
    ? '<div class="mat-rotulo">' + ICONES.caixa + '<span style="display:inline-block;margin-left:5px;">Materiais</span></div>' +
      '<div class="materiais">' + escapar(materiais) + '</div>'
    : '';

  el.innerHTML =
    bloco +
    '<div class="corpo">' +
      '<div class="topo">' +
        '<div><div class="cliente">' + escapar(it.cliente || 'Sem nome') + badge + '</div>' +
        (it.evento ? '<div class="evento">' + escapar(it.evento) + '</div>' : '') +
        '</div>' +
        '<div class="topo-dir">' +
          '<span class="status">' + escapar(it.status || 'Agendado') + '</span>' +
          '<button class="btn-imprimir" onclick="event.stopPropagation();imprimirOrdem(' + it.id + ')" title="Imprimir ordem de montagem">' + ICONES.impressora + '</button>' +
          (!MODO_LEITURA ? '<button class="btn-editar" onclick="event.stopPropagation();abrirFormulario(' + it.id + ')" title="Editar agendamento">' + ICONES.lapis + '</button>' : '') +
        '</div>' +
      '</div>' +
      '<div class="detalhes">' +
        (it.dataEvento ? '<div class="item">' + ICONES.estrela + '<span>Evento: <b>' + fmtData(it.dataEvento) + '</b></span></div>' : '') +
        (it.local ? '<div class="item">' + ICONES.pin + '<span>' + escapar(it.local) + '</span></div>' : '') +
        (it.obs ? '<div class="item">' + ICONES.nota + '<span>' + escapar(it.obs) + '</span></div>' : '') +
        blocoMat +
      '</div>' +
    '</div>';

  var imgs = (it.imagens || []).filter(Boolean);
  if (imgs.length) {
    var wrap = document.createElement('div');
    wrap.className = 'cartao-imgs';
    for (var ii = 0; ii < imgs.length && ii < 4; ii++) {
      (function (src) {
        var im = document.createElement('img');
        im.src = src;
        im.alt = '';
        im.onclick = function (e) { e.stopPropagation(); abrirLuz(src); };
        wrap.appendChild(im);
      })(imgs[ii]);
    }
    if (imgs.length > 4) {
      var mais = document.createElement('span');
      mais.className = 'cartao-mais-imgs';
      mais.textContent = '+' + (imgs.length - 4);
      wrap.appendChild(mais);
    }
    el.querySelector('.corpo').appendChild(wrap);
  }

  el.addEventListener('mousedown', function (ev) {
    el._ix = ev.clientX;
    el._iy = ev.clientY;
    el._arrastou = false;
  });
  el.addEventListener('mousemove', function (ev) {
    if (el._arrastou) return;
    if (Math.abs(ev.clientX - (el._ix || 0)) > 6 || Math.abs(ev.clientY - (el._iy || 0)) > 6) {
      el._arrastou = true;
    }
  });
  el.addEventListener('click', function () {
    if (el._arrastou) return;
    var sel = window.getSelection();
    if (sel && !sel.isCollapsed && sel.toString().trim() !== '') return;
    abrirDetalhes(it.id);
  });
  return el;
}

function escapar(txt) {
  var div = document.createElement('div');
  div.textContent = txt;
  return div.innerHTML;
}

// ---------- imagens / layout ----------
function carregarImagem(arquivo, cb) {
  var leitor = new FileReader();
  leitor.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 1280;
      var escala = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * escala));
      var h = Math.max(1, Math.round(img.height * escala));
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      cb(cv.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = function () { cb(null); };
    img.src = leitor.result;
  };
  leitor.onerror = function () { cb(null); };
  leitor.readAsDataURL(arquivo);
}

// ---------- fotos em pasta separada (imagens/) ----------
function ehDataURL(s) { return typeof s === 'string' && s.indexOf('data:') === 0; }
function ehCaminhoImagem(s) { return typeof s === 'string' && s.indexOf('imagens/') === 0; }
function novoNomeImagem() {
  return 'foto-' + Date.now().toString(36) + '-' + Math.floor(Math.random() * 100000).toString(36) + '.jpg';
}
function subirImagem(dataUrl) {
  return new Promise(function (resolve) {
    var i = dataUrl.indexOf(',');
    var b64 = i >= 0 ? dataUrl.slice(i + 1) : dataUrl;
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
    var nome = novoNomeImagem();
    fetch('imagens/' + nome, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: bytes
    }).then(function (r) {
      if (!r.ok) throw new Error('upload');
      return r.text();
    }).then(function (path) {
      resolve(path || 'imagens/' + nome);
    }).catch(function () { resolve(null); });
  });
}
function apagarImagemServidor(caminho) {
  if (!ehCaminhoImagem(caminho)) return;
  fetch(caminho, { method: 'DELETE' }).catch(function () {});
}
function prepararImagensParaSalvar(lista) {
  if (!Array.isArray(lista)) lista = [];
  if (!MODO_SERVIDOR) return Promise.resolve(lista.filter(Boolean));
  var pendentes = [];
  lista.forEach(function (s, idx) { if (ehDataURL(s)) pendentes.push(idx); });
  if (pendentes.length === 0) return Promise.resolve(lista.filter(Boolean));
  var resultado = lista.slice();
  var p = Promise.resolve();
  pendentes.forEach(function (idx) {
    p = p.then(function () {
      return subirImagem(resultado[idx]).then(function (path) {
        resultado[idx] = path;
      });
    });
  });
  return p.then(function () { return resultado.filter(Boolean); });
}

function adicionarImagens(ev) {
  var files = ev.target.files || [];
  for (var i = 0; i < files.length; i++) {
    (function (f) {
      carregarImagem(f, function (src) {
        if (src) { IMAGENS_EDITANDO.push(src); renderImagens(); }
      });
    })(files[i]);
  }
  ev.target.value = '';
}

function renderImagens() {
  var area = $('imagens-previa');
  if (!area) return;
  area.innerHTML = '';
  if (IMAGENS_EDITANDO.length === 0) {
    area.classList.add('vazio');
    area.onclick = function () { $('in-imagem').click(); };
    area.innerHTML = 'Cole a imagem aqui (Ctrl+V)<small>ou toque para escolher do dispositivo</small>';
    return;
  }
  area.classList.remove('vazio');
  area.onclick = null;
  IMAGENS_EDITANDO.forEach(function (src, idx) {
    var div = document.createElement('div');
    div.className = 'img-mini';
    var img = document.createElement('img');
    img.src = src;
    img.title = 'Ampliar';
    img.onclick = function () { abrirLuz(src); };
    var x = document.createElement('button');
    x.className = 'img-remover';
    x.title = 'Remover imagem';
    x.textContent = '\u00d7';
    x.onclick = function (e) {
      e.stopPropagation();
      IMAGENS_EDITANDO.splice(idx, 1);
      renderImagens();
    };
    div.appendChild(img);
    div.appendChild(x);
    area.appendChild(div);
  });
}

function abrirLuz(src) {
  var luz = $('luz');
  var img = $('luz-img');
  img.src = src;
  luz.classList.remove('oculto');
}

function fecharLuz() {
  var luz = $('luz');
  luz.classList.add('oculto');
  $('luz-img').src = '';
}

// ---------- detalhes ----------
function abrirDetalhes(id) {
  DETALHE_GRUPO = [id];
  DETALHE_INDEX = 0;
  renderDetalhe();
}

function abrirDetalhesDia(ids, idx) {
  DETALHE_GRUPO = ids.slice();
  DETALHE_INDEX = idx;
  renderDetalhe();
}

function navDetalhe(dir) {
  var n = DETALHE_GRUPO.length;
  if (n < 2) return;
  DETALHE_INDEX = (DETALHE_INDEX + dir + n) % n;
  renderDetalhe();
}

function renderDetalhe() {
  var id = DETALHE_GRUPO[DETALHE_INDEX];
  var it = null;
  for (var i = 0; i < DADOS.length; i++) {
    if (DADOS[i].id == id) { it = DADOS[i]; break; }
  }
  if (!it) return;
  DETALHE_ID = id;

  var d = defData(it.dataMontagem);
  var corpo = '';
  corpo += '<div class="dt-bloco">';
  if (!d.sem) {
    corpo += '<div class="dt-data"><span class="dia">' + d.num + '</span><span class="mes">' + d.mes + '</span></div>';
  }
  corpo += '<div class="dt-infos">' +
    '<div class="dt-titulo">' + escapar(it.cliente || 'Sem nome') + '</div>' +
    (it.evento ? '<div class="dt-sub">' + escapar(it.evento) + '</div>' : '') +
    '<div class="dt-sub">N&ordm; ' + it.id + '</div>' +
    '</div>' +
  '</div>';

  corpo += '<div class="dt-secao">Dados</div>';
  corpo += '<div class="dt-linha">' + ICONES.pin + '<span><b>Local:</b> ' + escapar(it.local || '—') + '</span></div>';
  corpo += '<div class="dt-linha">' + ICONES.estrela + '<span><b>Data do evento:</b> ' + fmtData(it.dataEvento) + '</span></div>';
  corpo += '<div class="dt-linha">' + ICONES.caixa + '<span><b>Data da montagem:</b> ' + fmtData(it.dataMontagem) + '</span></div>';

  var mats = (it.materiais || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  if (mats.length) {
    corpo += '<div class="dt-secao">Materiais</div>';
    corpo += '<ul class="dt-materiais">';
    mats.forEach(function (m) { corpo += '<li><span class="ck"></span><span>' + escapar(m) + '</span></li>'; });
    corpo += '</ul>';
  }

  if (it.obs) {
    corpo += '<div class="dt-secao">Observa&ccedil;&otilde;es</div>';
    corpo += '<div class="dt-linha">' + escapar(it.obs) + '</div>';
  }

  var imgsDet = (it.imagens || []).filter(Boolean);
  if (imgsDet.length) {
    corpo += '<div class="dt-secao">Imagem / Layout</div>';
    corpo += '<div class="dt-imgs">' + imgsDet.map(function (s) { return '<img class="dt-img" src="' + s + '" alt="">'; }).join('') + '</div>';
  }

  $('dt-titulo').textContent = it.cliente || 'Sem nome';
  var st = $('dt-status');
  st.textContent = it.status || 'Agendado';
  st.className = 'dt-chip ' + (it.status || '').toLowerCase();
  $('btn-dt-editar').classList.toggle('oculto', MODO_LEITURA);
  $('dt-corpo').innerHTML = corpo;

  var elsImgs = $('dt-corpo').querySelectorAll('.dt-img');
  for (var q = 0; q < elsImgs.length; q++) {
    (function (el2, src) {
      el2.onclick = function () { abrirLuz(src); };
    })(elsImgs[q], imgsDet[q]);
  }

  var nav = $('dt-nav');
  var n = DETALHE_GRUPO.length;
  nav.classList.toggle('oculto', n < 2);
  $('dt-contador').textContent = (DETALHE_INDEX + 1) + '/' + n;

  $('modal-detalhe').classList.remove('oculto');
}

function fecharDetalhes() {
  $('modal-detalhe').classList.add('oculto');
  DETALHE_ID = null;
  DETALHE_GRUPO = [];
  DETALHE_INDEX = 0;
}

function editarDeDetalhe() {
  var id = DETALHE_ID;
  fecharDetalhes();
  if (id !== null) abrirFormulario(id);
}

function imprimirDeDetalhe() {
  if (DETALHE_ID !== null) imprimirOrdem(DETALHE_ID);
}

function salvarFormulario() {
  var cliente = $('f-cliente').value.trim();
  if (!cliente) { toast('Informe o nome do cliente'); $('f-cliente').focus(); return; }

  var dados = ler();
  var obj = {
    id: EDITANDO_ID,
    cliente: cliente,
    evento: $('f-evento').value.trim(),
    dataMontagem: $('f-montagem').value,
    dataEvento: $('f-evento-dt').value,
    local: $('f-local').value.trim(),
    materiais: $('f-materiais').value.trim(),
    obs: $('f-obs').value.trim(),
    status: $('f-status').value,
    imagens: IMAGENS_EDITANDO.slice()
  };
  var statusFinal = obj.status;
  if (statusFinal === 'Montado' || statusFinal === 'Cancelado') obj.imagens = [];
  var ehNovo = (obj.id === null);

  var btnOk = null;
  if (obj.id !== null) {
    var antigo = dados.find(function (d) { return d.id == obj.id; });
    if (antigo && antigo.imagens) btnOk = antigo.imagens;
  }

  var btnSalvar = document.querySelector('.btn-salvar');
  if (btnSalvar) btnSalvar.disabled = true;
  prepararImagensParaSalvar(obj.imagens).then(function (imagensFinais) {
    obj.imagens = imagensFinais;
    if (obj.id === null) {
      var maxId = 0;
      dados.forEach(function (d) { if (d.id > maxId) maxId = d.id; });
      obj.id = maxId + 1;
      dados.push(obj);
    } else {
      var idx = dados.findIndex(function (d) { return d.id == obj.id; });
      if (idx >= 0) dados[idx] = obj;
    }

    if (MODO_SERVIDOR && Array.isArray(btnOk)) {
      var novos = {};
      (obj.imagens || []).forEach(function (s) { if (ehCaminhoImagem(s)) novos[s] = true; });
      btnOk.forEach(function (s) {
        if (ehCaminhoImagem(s) && !novos[s]) apagarImagemServidor(s);
      });
    }

    gravar(dados);
    notificarMudanca(ehNovo, obj);
    DADOS = ordenar(dados);
    fecharFormulario();
    toast('Salvo!');
    carregar();
    if (btnSalvar) btnSalvar.disabled = false;
  }).catch(function () {
    if (btnSalvar) btnSalvar.disabled = false;
    toast('Não foi possível salvar as imagens');
  });
}

function excluirAtual() {
  if (EDITANDO_ID === null) return;
  if (!confirm('Excluir este agendamento?')) return;
  var dados = ler();
  var alvo = dados.find(function (d) { return d.id == EDITANDO_ID; });
  if (MODO_SERVIDOR && alvo && Array.isArray(alvo.imagens)) {
    alvo.imagens.forEach(function (s) { if (ehCaminhoImagem(s)) apagarImagemServidor(s); });
  }
  var restantes = dados.filter(function (d) { return d.id != EDITANDO_ID; });
  gravar(restantes);
  DADOS = restantes;
  fecharFormulario();
  toast('Excluído');
  carregar();
}

// ---------- exportar / importar ----------
function baixarJSON(objeto) {
  var blob = new Blob([JSON.stringify(objeto, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'agenda-festas-dados.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportar() {
  var fonte = MODO_SERVIDOR ? DADOS : ler();
  var copia = JSON.parse(JSON.stringify(fonte));
  var tarefas = [];
  copia.forEach(function (it) {
    if (!Array.isArray(it.imagens)) return;
    it.imagens.forEach(function (src, i) {
      if (!ehCaminhoImagem(src)) return;
      tarefas.push(
        fetch(src, { cache: 'no-store' })
          .then(function (r) { if (!r.ok) throw new Error('img'); return r.blob(); })
          .then(function (blob) {
            return new Promise(function (resolve) {
              var fr = new FileReader();
              fr.onload = function () { resolve(fr.result); };
              fr.onerror = function () { resolve(src); };
              fr.readAsDataURL(blob);
            });
          })
          .then(function (dataUrl) { it.imagens[i] = dataUrl; })
          .catch(function () {})
      );
    });
  });
  Promise.all(tarefas).then(function () {
    baixarJSON(copia);
    toast('Arquivo exportado');
  });
}

function importar(ev) {
  var arquivo = ev.target.files[0];
  if (!arquivo) return;
  var leitor = new FileReader();
  leitor.onload = function () {
    try {
      var dados = JSON.parse(leitor.result);
      if (!Array.isArray(dados)) { toast('Arquivo inválido'); return null; }
      if (!confirm('Substituir os dados atuais pelos do arquivo?')) return null;
      var encTotal = 0;
      dados.forEach(function (it) {
        if (!Array.isArray(it.imagens)) return;
        it.imagens.forEach(function (src) {
          if (ehDataURL(src)) encTotal++;
        });
      });
      var importou = function () {
        DADOS = ordenar(dados);
        gravar(DADOS);
        toast(encTotal > 0 ? 'Dados importados (fotos subidas ao servidor)' : 'Dados importados');
        carregar();
      };
      if (MODO_SERVIDOR && encTotal > 0) {
        var pend = [];
        dados.forEach(function (it) {
          if (!Array.isArray(it.imagens)) return;
          it.imagens.forEach(function (src, i) {
            if (ehDataURL(src)) pend.push({ it: it, i: i, src: src });
          });
        });
        var p = Promise.resolve();
        pend.forEach(function (t) {
          p = p.then(function () {
            return subirImagem(t.src).then(function (path) {
              if (path) t.it.imagens[t.i] = path;
            });
          });
        });
        p.then(importou);
      } else {
        importou();
      }
    } catch (e) {
      toast('Não deu pra ler o arquivo');
    }
  };
  leitor.readAsText(arquivo);
  ev.target.value = '';
}

// ---------- ordem de montagem / impressao ----------
function montarOrdem(it) {
  var linhas = (it.materiais || '').split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  var checks = '';
  linhas.forEach(function (l) {
    checks += '<div class="ck"><span class="cd"></span>' + escapar(l) + '</div>';
  });

  var html = '';
  html += '<div class="ordem">';
  html += '<div class="ordem-topo">' +
    '<div class="ordem-logo">' + LOGO_ESCURO + '</div>' +
    '<div><div class="ordem-titulo">AGENDA DE FESTAS</div><div class="ordem-sub">Ordem de Montagem</div></div>' +
    '<div class="ordem-num">N&ordm; ' + it.id + '</div>' +
  '</div>';
  html += '<div class="ordem-dados">';
  html += '<p><strong>Cliente:</strong> ' + escapar(it.cliente || '\u2014') + '</p>';
  if (it.evento) html += '<p><strong>Evento:</strong> ' + escapar(it.evento) + '</p>';

  var datas = '';
  if (it.dataMontagem) datas += '<p><strong>Data da montagem:</strong> ' + fmtData(it.dataMontagem) + '</p>';
  if (it.dataEvento) datas += '<p><strong>Data do evento:</strong> ' + fmtData(it.dataEvento) + '</p>';
  if (datas) html += '<div class="ordem-duas">' + datas + '</div>';

  if (it.local) html += '<p><strong>Local da montagem:</strong> ' + escapar(it.local) + '</p>';
  if (it.obs) html += '<p><strong>Observa&ccedil;&otilde;es:</strong> ' + escapar(it.obs) + '</p>';
  html += '</div>';

  html += '<div class="ordem-secao">Checklist de materiais</div>';
  html += linhas.length
    ? '<div class="ordem-checklist">' + checks + '</div>'
    : '<p style="margin-top:8px;color:#444;">Nenhum material informado.</p>';

  var imgsOrd = (it.imagens || []).filter(Boolean);
  if (imgsOrd.length) {
    html += '<div class="ordem-secao">Imagem / Layout</div>';
    html += '<div class="ordem-imgs">' + imgsOrd.map(function (s) { return '<img class="ordem-img" src="' + s + '">'; }).join('') + '</div>';
  }

  html += '<div class="ordem-rodape"><div class="linha">Montador</div><div class="linha">Conferido por</div><div class="linha">Data</div></div>';
  html += '</div>';
  return html;
}

function imprimirOrdem(id) {
  var it = null;
  for (var i = 0; i < DADOS.length; i++) {
    if (DADOS[i].id == id) { it = DADOS[i]; break; }
  }
  if (!it) return;
  $('impressao').innerHTML = montarOrdem(it);
  setTimeout(function () { window.print(); }, 40);
}

function imprimirAtual() {
  if (EDITANDO_ID !== null) imprimirOrdem(EDITANDO_ID);
}

function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('mostrar');
  setTimeout(function () { t.classList.remove('mostrar'); }, 2200);
}

window.addEventListener('DOMContentLoaded', function () {
  try {
    if (localStorage.getItem(CHAVE_TEMA) === 'escuro') {
      document.documentElement.setAttribute('data-tema', 'escuro');
    }
  } catch (e) {}

  $('busca').addEventListener('input', renderizar);
  $('filtro-mes').addEventListener('change', renderizar);
  $('f-status').addEventListener('change', function () {
    if (($('f-status').value === 'Montado' || $('f-status').value === 'Cancelado') && IMAGENS_EDITANDO.length) {
      toast('Ao salvar, as imagens de layout serão removidas (montagem concluída)');
    }
  });
  $('btn-hoje').addEventListener('click', function () {
    if (MODO === 'cal') {
      var d = new Date();
      CAL.a = d.getFullYear();
      CAL.m = d.getMonth();
      renderizar();
      return;
    }
    var hoje = hojeISO();
    $('filtro-mes').value = hoje.slice(0, 7);
    renderizar();
    var hojeS = document.querySelector('.badge-hoje');
    if (hojeS) hojeS.scrollIntoView({ block: 'center' });
  });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (!$('luz').classList.contains('oculto')) { fecharLuz(); return; }
    if (!$('modal-detalhe').classList.contains('oculto')) { fecharDetalhes(); return; }
    fecharFormulario();
  });
  document.addEventListener('paste', function (ev) {
    if ($('modal').classList.contains('oculto')) return;
    var itens = ev.clipboardData ? ev.clipboardData.items : [];
    var achou = false;
    for (var i = 0; i < itens.length; i++) {
      if (itens[i].type && itens[i].type.indexOf('image/') === 0) {
        var arquivo = itens[i].getAsFile();
        if (!arquivo) continue;
        achou = true;
        carregarImagem(arquivo, function (src) {
          if (src) { IMAGENS_EDITANDO.push(src); renderImagens(); }
        });
      }
    }
    if (achou) ev.preventDefault();
  });
  prepararLogos(function () {
    $('logo-app').innerHTML = LOGO_HEADER;
    atualizarIconeTema();
    if (MODO_LEITURA) {
      $('btn-add').classList.add('oculto');
      $('btn-exportar').classList.add('oculto');
      $('btn-importar').classList.add('oculto');
      $('btn-atualizar').classList.remove('oculto');
      carregarLeitura();
      setInterval(carregarLeitura, 30000);
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') carregarLeitura();
      });
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
      return;
    }
    carregarInicial();
  });
});
</script>
